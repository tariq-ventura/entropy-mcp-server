apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mcp-server-development
  labels:
    run.googleapis.com/satisfiesPzs: "true"
    cloud.googleapis.com/location: us-east4
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: minecraft-server-501415:us-east4:entropy
        run.googleapis.com/sessionAffinity: "false"
        run.googleapis.com/vpc-access-egress: all-traffic
        autoscaling.knative.dev/minScale: 0
        autoscaling.knative.dev/maxScale: 3
        run.googleapis.com/network-interfaces: "[{\"network\":\"entropy-vpc-development\"\
          ,\"subnetwork\":\"entropy-subnet-development-01\"}]"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: fleet-service@minecraft-server-501415.iam.gserviceaccount.com
      containers:
      - name: mcp-server-1
        image: us-east4-docker.pkg.dev/minecraft-server-501415/development/mcp-server:42146e2
        ports:
        - name: http1
          containerPort: 3002
        env:
        - name: LOGISTIC_SERVICE_URL
          value: https://logistic-service-development-534053084464.us-east4.run.app
        - name: LOGISTIC_SERVICE_AUDIENCE
          value: https://logistic-service-development-534053084464.us-east4.run.app
        - name: LOGISTIC_SERVICE_TOKEN
          value: '"token"'
        - name: FLEET_SERVICE_URL
          value: https://fleet-service-development-534053084464.us-east4.run.app
        - name: FLEET_SERVICE_TOKEN
          value: '"token"'
        - name: DB_MAX_OPEN_CONNS
          value: 10
        - name: DB_MAX_IDLE_CONNS
          value: 5
        - name: DB_CONN_MAX_LIFETIME
          value: 30m
        - name: SYNC_INTERVAL
          value: 30s
        - name: EMBEDDING_PROVIDER
          value: vertex
        - name: EMBEDDING_DIMENSIONS
          value: 768
        - name: GCP_PROJECT_ID
          value: minecraft-server-501415
        - name: VERTEX_LOCATION
          value: us-east4
        - name: EMBEDDING_MODEL
          value: text-multilingual-embedding-002
        - name: MCP_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: mcp-apikey-development
        - name: INTEGRATION_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: mcp-apikey-development
        - name: MCP_DB_STRING
          valueFrom:
            secretKeyRef:
              key: latest
              name: mcp-db-development
        resources:
          limits:
            cpu: 1000m
            memory: 128Mi
        startupProbe:
          timeoutSeconds: 240
          periodSeconds: 240
          failureThreshold: 1
          tcpSocket:
            port: 3002
  traffic:
  - percent: 100
    latestRevision: true